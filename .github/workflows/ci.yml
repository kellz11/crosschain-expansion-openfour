name: bnb-openfour-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run verify:upstream
      - run: npm test
      - run: npm ci --prefix solana --legacy-peer-deps
      - run: npm test --prefix solana
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            artifacts/build-report.json
            docs/reports/economics.json
