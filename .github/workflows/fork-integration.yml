name: BNB OpenFour fork integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test:fork
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openfour-fork-evidence
          path: |
            docs/reports/openfour-fork.json
            work/fork/node.log
